upstream lc_web {
  server web:3000;
}

upstream lc_api {
  server server:3001;
}

# 表单提交限流(每 IP 10r/m,burst 5)
limit_req_zone $binary_remote_addr zone=lc_form:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # 表单提交接口:限流
  location = /api/forms {
    limit_req zone=lc_form burst=5 nodelay;
    proxy_pass http://lc_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 静态导出:由 web 渲染(pages/api),需在 /api/ 之前匹配
  location /api/export/ {
    proxy_pass http://lc_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 其余 API:Hono server
  location /api/ {
    proxy_pass http://lc_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 页面应用:Next.js(编辑器 / 发布页 / 导出)
  location / {
    proxy_pass http://lc_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
